name: Verify fixtures

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-fixtures:
    name: Synthetic spend fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fixture contract tests
        run: python3 scripts/verify_fixtures.py

      - name: Check trigger phrases in SKILL.md
        run: python3 scripts/check_trigger_phrases.py
